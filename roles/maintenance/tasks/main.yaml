- name: Install maintenance packages
  ansible.builtin.package:
    name:
      - unattended-upgrades
      - curl
      - jo
    state: present

# Written explicitly, as some provider images ship with it disabled.
- name: Enable unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: Install maintenance reboot script
  ansible.builtin.copy:
    src: maintenance_reboot.sh
    dest: /usr/local/sbin/maintenance_reboot.sh
    mode: "0755"

- name: Install maintenance reboot environment file
  ansible.builtin.template:
    src: maintenance_reboot.env.j2
    dest: /etc/default/maintenance_reboot
    mode: "0600"
  when: maintenance_discord_webhook_url | default('', true) | length > 0
  no_log: true
  diff: false

- name: Remove maintenance reboot environment file
  ansible.builtin.file:
    path: /etc/default/maintenance_reboot
    state: absent
  when: maintenance_discord_webhook_url | default('', true) | length == 0

- name: Install maintenance reboot service unit
  ansible.builtin.template:
    src: maintenance_reboot.service.j2
    dest: /etc/systemd/system/maintenance_reboot.service
    mode: "0644"
  register: maintenance_service_unit

- name: Reload systemd daemon
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: maintenance_service_unit.changed

- name: Install maintenance reboot timer unit
  ansible.builtin.template:
    src: maintenance_reboot.timer.j2
    dest: /etc/systemd/system/maintenance_reboot.timer
    mode: "0644"
  when: maintenance_windows | length > 0

- name: Check if maintenance reboot timer unit exists
  ansible.builtin.stat:
    path: /etc/systemd/system/maintenance_reboot.timer
  register: maintenance_timer_unit

- name: Configure maintenance reboot timer
  ansible.builtin.systemd_service:
    name: maintenance_reboot.timer
    daemon_reload: true
    enabled: "{{ maintenance_windows | length > 0 }}"
    state: "{{ (maintenance_windows | length > 0) | ternary('started', 'stopped') }}"
  when: maintenance_windows | length > 0 or maintenance_timer_unit.stat.exists

- name: Remove maintenance reboot timer unit
  ansible.builtin.file:
    path: /etc/systemd/system/maintenance_reboot.timer
    state: absent
  when: maintenance_windows | length == 0
